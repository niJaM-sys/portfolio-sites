<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Page affichée après l'envoi du formulaire quand JavaScript est désactivé. -->
  <title>Message envoyé — Ulysse Delourme</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Favicons : SVG (navigateurs récents), PNG 32 px (les autres), icône Apple 180 px (écran d’accueil iPhone) -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/style.css">
  <style>
    .merci { min-height: 100svh; display: grid; align-content: center; padding: 4rem 0 calc(4rem + var(--badge-space)); }
    .merci h1 { font-size: clamp(2.6rem, 1.2rem + 6vw, 6rem); letter-spacing: -.045em; margin: 1rem 0 1.5rem; }

  </style>
</head>
<body>
  <main class="merci">
    <div class="conteneur">
      <p class="mono"><span class="pastille" aria-hidden="true"></span>&nbsp; Message envoyé</p>
      <h1>Merci, à très vite<span class="accent">.</span></h1>
      <p>Votre message est bien arrivé. Je vous réponds sous 48 heures, par e-mail.</p>
      <a class="btn btn--plein" href="index.html">Retour au site <span class="btn__fleche" aria-hidden="true">→</span></a>
    </div>
  </main>

</html>
